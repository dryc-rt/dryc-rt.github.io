<!doctype html>
<html lang="es">
<head>

  <link rel="canonical" href="https://dryc-rt.github.io/">
  <title>DRyC | Acceso al sistema</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f3f6;--muted:#8b949e;--copper:#e06c00;--red:#b71c1c}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#252b33 0,var(--bg) 54%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);padding:24px}
    main{width:min(560px,100%);padding:42px;border:1px solid var(--line);border-radius:18px;background:rgba(22,27,34,.96);box-shadow:0 24px 70px rgba(0,0,0,.38);text-align:center}
    .mark{width:62px;height:62px;margin:0 auto 22px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,var(--red),var(--copper));font-weight:900;font-size:20px;letter-spacing:.04em}
    h1{margin:0 0 8px;font-size:clamp(25px,5vw,34px)}
    .unit{margin:0 0 28px;color:var(--muted);font-size:14px;line-height:1.55}
    .status{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 26px;color:#c9d1d9}
    .dot{width:9px;height:9px;border-radius:50%;background:#4caf50;box-shadow:0 0 0 6px rgba(76,175,80,.12);animation:pulse 1.2s infinite}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border-radius:10px;background:linear-gradient(135deg,#bf360c,var(--copper));color:#fff;text-decoration:none;font-weight:750;box-shadow:0 8px 24px rgba(224,108,0,.22)}
    small{display:block;margin-top:24px;color:var(--muted);line-height:1.5}
    @keyframes pulse{50%{opacity:.35}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">DRyC</div>
    <h1>Sistema Integral de Gestión</h1>
    <p class="unit">Dirección de Riesgos y Control · División Radomiro Tomic</p>
    <p class="status"><span class="dot"></span>Redirigiendo al acceso seguro…</p>
    <a href="https://shiny-xylophone-pj479j75x6q9fr9gq-5000.app.github.dev/">Ingresar al sistema</a>
    <small>Acceso restringido a personal autorizado.</small>
  </main>
  <script>window.setTimeout(function(){window.location.replace('https://shiny-xylophone-pj479j75x6q9fr9gq-5000.app.github.dev/');},700);</script>
